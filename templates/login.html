{% extends 'base.html' %} 

{% block container %}
<div class="main-container">
    <h2>Welcome back</h2>
    <p>Log in to see what your roommates are sharing.</p>
    <form method="post" action="{{ url_for('login') }}">
        <label>Username</label>
        <input type="text" name="username" required>

        <label>Password</label>
        <input type="password" name="password" required>

        <button type="submit" class="page-button"> Log In </button>
    </form>
    <p>No account? <a href="{{ url_for('register') }}">Sign up</a></p>
</div>

{% endblock %}
