{% extends 'base.html' %} {% block container %}
<h2>My Items</h2>
<div class="grid">
    
        {% for item in items %}
            <a href="{{ url_for('item_detail', item_id=item._id) }}" class="grid-block">
                {{ item.name }}, qty: {{ item.quantity }}
            </a>
        {% else %}
            <p>You haven't added anything yet.</p>
        {% endfor %}
    
</div>

{% endblock %}

{% block tools %}
<a href="{{ url_for('logout') }}" class="page-button"> Log Out </a>

{% endblock %}
