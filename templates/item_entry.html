{% extends 'base.html' %} 

{% block container %}
<div>
    {% if item %}
    <form method="post" action="{{ url_for('item_edit', item_id=item._id) }}">
    {% else %}
    <form method="post" action="{{ url_for('item_create') }}">
    {% endif %}

        <label>Item Name</label>
        <input type="text" name="item_name" value="{{ item.name if item else '' }}" required>

        <label>Category</label>
        <select name="item_category">
            {% for c in categories %}
                <option value="{{ c }}" {% if item and item.category == c %}selected{% endif %}>{{ c }}</option>
            {% endfor %}
        </select>

        <label>Quantity</label>
        <input type="text" name="item_quantity" value="{{ item.quantity if item else '1' }}">

        <label>Description</label>
        <input type="text" name="item_description" value="{{ item.description if item else '' }}">

        <input type="radio" name="tag" value="everyone" {% if item and item.shared %}checked{% endif %}>
        <label>For Everyone</label>
        <input type="radio" name="tag" value="me" {% if not item or not item.shared %}checked{% endif %}>
        <label>For Me</label>

        <button type="submit"> Submit</button>
    </form>
</div>

{% endblock %}

{% block tools %}
<a href="{{ url_for('logout') }}" class="page-button"> Log Out </a>

{% endblock %}
