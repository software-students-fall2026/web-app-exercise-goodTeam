<!doctype html>
<html>

<head>
	<title>RoomShare</title>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width">
	<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
	<header> 
		<h1> RoomShare </h1> 
		<div class="hor-bar">
			<a href="{{url_for('home')}}" class="page-button"> Feed </a>
			<a href="{{url_for('shared')}}" class="page-button"> Shared </a>
			<a href="{{url_for('items')}}" class="page-button"> Lists </a>
			<a href="{{url_for('profile')}}"class="page-button"> Profile </a>
		</div>
	</header>

	<div style="margin-top: 100px;"></div>

	{% with messages = get_flashed_messages() %}
		{% for message in messages %}
			<p>{{ message }}</p>
		{% endfor %}
	{% endwith %}

	<main>{% block container %} {% endblock %}</main>

	<div style="margin-bottom: 70px;"></div>

	<footer> 
		<div class="hor-bar">
			{% block tools %}
			{% endblock %}
		</div>
		<a href="{{url_for('item_entry')}}" class="add-button">  <img src="{{ url_for('static', filename='images/redplus.png') }}" width = 20 > </a>
	</footer>
</body>

</html>
