{% extends 'base.html' %} 

{% block container %}

        <article>
            <div class="feed-block">
                <h1>{{entry.name}}</h1>
                <h1>{{entry.description}}</h1>

    </section> 
    {% endfor %}

{% endblock %}

{% block tools %}

<button class="page-button"> Filter </button>

{% endblock %}
